name: Build APK and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'APK version'
        required: true
        type: string
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid version: $APP_VERSION"
            echo "Use a version such as 1.0.0 or 1.0.0-beta.1"
            exit 1
          fi

      - name: Set Android version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path('app/build.gradle.kts')
          source = path.read_text(encoding='utf-8')
          version = os.environ['APP_VERSION']
          pattern = r'versionName\s*=\s*"[^"]*"'
          updated, count = re.subn(pattern, f'versionName = "{version}"', source, count=1)
          if count != 1:
              raise SystemExit('Could not find versionName in app/build.gradle.kts')
          path.write_text(updated, encoding='utf-8')
          print(f'Building APK version {version}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug

      - name: Prepare release APK
        id: apk
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"

          # Prefer a signed release APK. If no keystore is configured in the
          # repository, publish the automatically debug-signed APK instead.
          if [[ -f "$RELEASE_APK" ]] && "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify "$RELEASE_APK" >/dev/null 2>&1; then
            APK="$RELEASE_APK"
          elif [[ -f "$DEBUG_APK" ]]; then
            APK="$DEBUG_APK"
            echo 'No release keystore configured; publishing the debug-signed APK.'
          else
            echo 'APK was not generated.'
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          mkdir -p release-files
          cp "$APK" "release-files/QuDroid-${APP_VERSION}.apk"
          echo "file=release-files/QuDroid-${APP_VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: QuDroid v${{ inputs.version }}
          generate_release_notes: true
          make_latest: true
          files: ${{ steps.apk.outputs.file }}
